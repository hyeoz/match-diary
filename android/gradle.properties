# React Native runtime settings expected by the Android Gradle plugins.
hermesEnabled=true
newArchEnabled=false

android.useAndroidX=true
android.enableJetifier=true

# Native React artifacts require more heap than Gradle's small default while
# Jetifier processes their AAR files.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
