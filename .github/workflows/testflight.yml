# main에 머지되면 iOS Release 빌드를 만들어 테스트플라이트에 올린다.
# 필요한 Secrets: ENV_FILE, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD (README 참고)
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      # react-native-dotenv가 빌드할 때 .env를 읽는다
      - name: .env 만들기
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: 타입체크
        run: npx tsc --noEmit

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: pod install
        working-directory: ios
        run: bundle exec pod install

      - name: 배포 인증서 꺼내기
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "DIST_CERT_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"

      - name: 빌드 + 테스트플라이트 업로드
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bundle exec fastlane beta

      - name: 빌드 로그 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-logs
          path: ~/Library/Logs/gym
