# main에 머지되면 iOS Release 빌드를 만들어 테스트플라이트에 올린다.
# 필요한 Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8,
# IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD (README 참고)
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

# main 에 연달아 머지해도 마지막 머지만 빌드한다.
# 1) wait: 머지 뒤 5분 기다린다. 그 사이 새 머지가 오면 기다리던 run 은 취소되고(빌드 안 함) 새 run 이 다시 기다린다.
# 2) ios: 빌드·업로드 중인 run 은 취소하지 않는다(업로드 도중 끊기면 빌드 번호가 꼬일 수 있어서).
#    빌드 중에 새 머지가 오면 그 run 은 대기하고, 대기 중인 run 은 더 새 run 이 오면 GitHub 이 취소한다.
#    그래서 빌드는 많아야 "지금 도는 것 + 가장 최근 것" 두 번만 돈다.
# 수동 실행(workflow_dispatch)은 기다리지 않는다.
jobs:
  wait:
    runs-on: ubuntu-latest
    concurrency:
      group: testflight-wait
      cancel-in-progress: true
    steps:
      - name: 연속 머지 모으기 (5분)
        if: github.event_name == 'push'
        run: sleep 300

  ios:
    needs: wait
    runs-on: macos-26
    concurrency:
      group: testflight
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: npm ci

      - name: 타입체크·린트·테스트
        run: npm run verify

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: pod install
        working-directory: ios
        run: bundle exec pod install

      - name: 배포 인증서 꺼내기
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "DIST_CERT_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"

      - name: 빌드 + 테스트플라이트 업로드
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: bundle exec fastlane beta

      - name: 빌드 로그 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-logs
          path: ~/Library/Logs/gym
